<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meridian</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: 'Segoe UI', system-ui, sans-serif; background: #0E0D27; color: #ECEDF5; }
    main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
    .logo { width: 56px; height: 56px; border-radius: 14px; background: #2B296E; display: grid; place-items: center; position: relative; }
    .logo::after { content: ''; position: absolute; right: -3px; bottom: -3px; width: 14px; height: 14px; border-radius: 50%; background: #97AC3B; border: 3px solid #0E0D27; }
    .bar { width: 220px; height: 4px; border-radius: 4px; background: #211F57; overflow: hidden; }
    .bar span { display: block; height: 100%; width: 40%; background: #0EA5E9; animation: s 1.2s infinite ease-in-out; }
    @keyframes s { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    #status { font-size: 13px; color: #9699B4; }
  </style>
</head>
<body>
  <main>
    <div class="logo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg></div>
    <div style="font-size:18px;font-weight:600">Meridian Banking Intelligence</div>
    <div class="bar"><span></span></div>
    <div id="status">Starting the local banking engine…</div>
  </main>
</body>
</html>
